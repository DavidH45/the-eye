# The Eye — compose file for Arcane / Portainer / Dockge and other UI managers.
#
# The image is built by GitHub Actions (.github/workflows/docker-publish.yml) and
# published to GHCR on every push to main. These managers just pull it — no build
# context, no Dockerfile handling on their side.
#
#   1. In GitHub: Packages -> the-eye -> Package settings -> make it Public
#      (or add a GHCR pull credential in Arcane -> Settings -> Registries).
#   2. Arcane: Projects -> Create Project -> paste this file (or sync from git).
#   3. Set DISCORD_TOKEN and TARGET_USER_ID in Arcane's environment editor.
#   4. Deploy. To update: push to main, wait for the Action, then redeploy / pull.
#
# Change the owner below if you forked to a different account.

services:
  theeye:
    image: ghcr.io/davidh45/the-eye:latest
    container_name: theeye_service
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in the Arcane env editor}
      TARGET_USER_ID: ${TARGET_USER_ID:?set TARGET_USER_ID in the Arcane env editor}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-30}
      DB_PATH: /app/data/theeye.db
      PORT: "3000"
    ports:
      - "8080:3000"
    volumes:
      - theeye_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  theeye_data:
    driver: local
