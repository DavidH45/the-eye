# The Eye — compose file for Arcane / Portainer / Dockge and other UI managers.
#
# Easiest path (Arcane): Projects -> Create Project -> "From Git Repo", point it
# at this repo, set Compose File Path to "docker-compose.arcane.yml", then use
# "Build & Deploy". Arcane clones the repo (build context) and builds the image.
# Set DISCORD_TOKEN and TARGET_USER_ID in Arcane's environment editor.
#
# No git sync? Build the image on the Docker host once (docker build -t
# theeye:latest .) and paste this file as a stack — the pre-built image is
# reused because it is tagged theeye:latest.

services:
  theeye:
    build: .
    image: theeye:latest        # name for the locally-built image
    pull_policy: build          # always build from ./Dockerfile, never pull from a registry
    container_name: theeye_service
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in the Arcane env editor}
      TARGET_USER_ID: ${TARGET_USER_ID:?set TARGET_USER_ID in the Arcane env editor}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-30}
      DB_PATH: /app/data/theeye.db
      PORT: "3000"
    ports:
      - "8080:3000"
    volumes:
      - theeye_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  theeye_data:
    driver: local
